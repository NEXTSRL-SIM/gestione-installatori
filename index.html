<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestione installatori</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;background:#f2f4f7;font-family:Manrope,system-ui,sans-serif;color:#111827;padding:22px 24px}
.att{font-size:13px;color:#6b7686}.chiave{max-width:420px;background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:18px}
.chiave p{font-size:13px;color:#6b7686;margin:0 0 10px}.chiave form{display:flex;gap:8px}
.chiave input{flex:1;border:1px solid #e2e7ee;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px}
.chiave button{background:#0891b2;color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
html[data-tema="scuro"] body{background:#0f141b;color:#e6ebf2}</style></head>
<body><h1 style="font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px">Gestione installatori</h1><div id="carico"><p class="att">Carico le pratiche…</p></div>
<script>
function buildHtml(d){
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // esc per stringa incorporata in codice JS (single-quote / backslash)
  const jesc = s => (s==null?'':String(s)).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  // -------------------- PROXY DOCUMENTI (anti ERR_BLOCKED_BY_CLIENT) ---------
  // I link diretti allo storage Supabase (pnxhthrheqeucoisifjw.supabase.co) sono
  // richieste di TERZA PARTE rispetto al dominio n8n che ospita questa pagina:
  // Edge (prevenzione tracciamento) e gli adblocker li bloccano con
  // ERR_BLOCKED_BY_CLIENT e il file non si apre. Li facciamo quindi passare dal
  // webhook proxy /webhook/doc, ospitato sullo STESSO dominio della pagina
  // (prima parte -> nessun blocco). Il proxy scarica il file dallo storage e lo
  // restituisce; accetta solo url public dello storage (bucket documenti /
  // contratti / preventivi). Gli url non-storage vengono restituiti invariati.
  // IMPORTANTE: si passano BUCKET e PERCORSO separati, MAI l'url completo in ?u=.
  // Verificato il 27/07: se l'indirizzo del link contiene la stringa del dominio
  // storage (…supabase.co…), anche solo come parametro, le protezioni del browser
  // (prevenzione tracciamento Edge, adblocker) bloccano l'apertura e la scheda va
  // in errore; con ?b=<bucket>&p=<percorso> quel nome non compare e il PDF si apre.
  function docUrl(u){
    const s = String(u||'');
    if(!s) return '';
    const PRE = 'https://pnxhthrheqeucoisifjw.supabase.co/storage/v1/object/public/';
    if(s.indexOf(PRE) !== 0) return s;
    const resto = s.slice(PRE.length);
    const i = resto.indexOf('/');
    if(i < 1) return s;
    const bucket = resto.slice(0, i);
    const perc = resto.slice(i + 1);
    return 'https://n8n.srv1030489.hstgr.cloud/webhook/doc?b=' + encodeURIComponent(bucket) + '&p=' + encodeURIComponent(perc);
  }
  // -------------------- DOWNLOAD DIRETTO DEI DOCUMENTI -----------------------
  // Verificato il 27/07 (prove reali, in ordine): (1) link diretto allo storage ->
  // ERR_BLOCKED_BY_CLIENT; (2) proxy /webhook/doc: il server risponde 200
  // application/pdf ma la scheda aperta dal LINK viene comunque bloccata dal
  // browser (lo stesso indirizzo DIGITATO a mano si apre); (3) scheda vuota
  // aperta e poi portata su un blob: -> resta su about:blank (Chrome) / errore
  // cross-origin (Edge); (4) anteprima in overlay con iframe -> bloccata da Edge.
  // COSTANTE in tutte le prove: la fetch dalla pagina verso il proxy funziona
  // SEMPRE e il salvataggio con <a download> su blob url funziona SEMPRE.
  // DECISIONE: niente anteprima. Il documento viene SCARICATO direttamente
  // (fetch -> blob -> <a download>), unica strada affidabile su tutti i browser.
  // Vedi apriDoc() nello SCRIPT.
  // docName: nome del documento, usato come nome del file salvato e nel messaggio
  // di avanzamento; ricavato dall'ultima parte del percorso.
  function docName(u, fallback){
    const s = String(u||'').split('?')[0];
    const last = s.slice(s.lastIndexOf('/')+1);
    let n = last;
    try{ n = decodeURIComponent(last); }catch(e){ n = last; }
    return n || fallback || 'documento.pdf';
  }
  // docOpenAttr: attributi href/onclick del pulsante documento; il click AVVIA IL
  // DOWNLOAD (apriDoc), non apre nulla. L'url passato ad apriDoc e' SEMPRE quello
  // prodotto da docUrl() (forma ?b=&p=). Doppio escaping:
  // jesc() per la stringa JS (apici/backslash) + esc() per l'attributo HTML.
  function docOpenAttr(u, nome){
    return ' href="#" onclick="event.preventDefault();event.stopPropagation();apriDoc(\''
      + esc(jesc(docUrl(u))) + '\',\'' + esc(jesc(nome)) + '\');return false;"';
  }
  const LOGO = 'https://pnxhthrheqeucoisifjw.supabase.co/storage/v1/object/public/preventivi/logos/next_logo_black.png';

  // ---- Pagina di errore (payload non valido) ----
  if(!d || !d.ok){
    return '<!doctype html><meta charset="utf-8"><body style="font-family:sans-serif;padding:40px;background:#f5f6f8;color:#1f2330"><h2>Dati non disponibili</h2><p>La RPC gestione_next_data non ha restituito dati validi.</p></body>';
  }

  const installatori = Array.isArray(d.installatori) ? d.installatori : [];
  const pratiche     = Array.isArray(d.pratiche)     ? d.pratiche     : [];

  // -------------------- HELPER GENERICI -------------------------------------
  const num = n => (n==null?'':String(n).replace('.',','));

  // Normalizza date_installazione (array | stringa json | stringa) -> array
  function datesArr(p){
    let a = p.date_installazione;
    if(Array.isArray(a)) return a.filter(Boolean);
    if(typeof a === 'string'){
      try{ const j=JSON.parse(a); if(Array.isArray(j)) return j.filter(Boolean); }catch(e){}
      if(a.trim()) return [a.trim()];
    }
    return [];
  }

  // Data compatta 'gg/mm' (come nel mockup) — '—' se assente/non valida
  function dataDM(v){
    if(!v) return '—';
    let s;
    if(v instanceof Date){
      if(isNaN(v.getTime())) return '—';
      s = v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
    } else { s = String(v); }
    const t = s.slice(0,10).split('-');
    if(t.length!==3 || !t[0] || !t[1] || !t[2]) return '—';
    return t[2]+'/'+t[1]+'/'+t[0].slice(2);
  }

  // Chiave di recency (piu' recenti in alto): usa il timestamp piu' avanzato tra
  // le date disponibili, poi practice_id come fallback.
  function tsOf(p){
    let m=0;
    [p.presa_in_carico_at,p.accettata_at,p.rifiutata_at,p.data_sopralluogo].forEach(v=>{
      if(v){ const t=Date.parse(v); if(!isNaN(t)&&t>m) m=t; }
    });
    return m;
  }
  function recentDesc(a,b){
    const dd = tsOf(b)-tsOf(a);
    if(dd) return dd;
    const na=Number(a.practice_id), nb=Number(b.practice_id);
    if(!isNaN(na)&&!isNaN(nb)) return nb-na;
    return String(b.practice_id).localeCompare(String(a.practice_id));
  }

  // -------------------- DROPDOWN "ASSEGNA A…" (senza duplicati) --------------
  // installatori: [{id, nome, coordinatore(bool), coordinatore_id, fv, termico}]
  // Mostra installatori e coordinatori senza duplicati; i coordinatori con
  // etichetta "(coordinatore)", gli altri "(installatore)".
  const seenAssign = {};
  const assignItems = [];
  installatori.forEach(i=>{
    if(i==null) return;
    const key = String(i.id);
    if(seenAssign[key]) return;
    seenAssign[key]=1;
    assignItems.push(i);
  });
  // -------------------- FILTRO PER SPECIALIZZAZIONE (fv / termico) -----------
  // REGOLA: nei menu di ASSEGNAZIONE compaiono SOLO gli installatori abilitati al
  // tipo di impianto della pratica (p.tipo_scheda):
  //   'termico'      -> solo chi ha termico === true
  //   'fotovoltaico' -> solo chi ha fv === true
  //   tipo mancante / sconosciuto -> nessun filtro (elenco completo, come prima)
  // CASO REALE: TECNO TERMICA SRL ha fv=false e termico=true, quindi NON deve
  // comparire nei menu delle pratiche FOTOVOLTAICHE (solo su quelle termiche);
  // GHIOTTO (fv=true, termico=false) e' il caso speculare; GREEN TEAM e
  // TECNOGREEN (entrambi true) compaiono ovunque.
  // ECCEZIONI — compaiono SEMPRE, anche se non superano il filtro:
  //   * l'installatore GIA ASSEGNATO alla pratica (selectedId): senza questa
  //     eccezione, nel menu "Riassegna" pre-selezionato sparirebbe il valore
  //     corrente e si perderebbe il dato a video.
  // COORDINATORI — NON sono piu' esenti dal filtro (correzione del 30/07). Un
  // coordinatore non esegue i lavori: li SMISTA ai PROPRI installatori, quindi se
  // nessuno dei suoi fa quel tipo di impianto non ha senso proporlo. REGOLA: un
  // coordinatore e' abilitato a un tipo di pratica se ha LUI STESSO quel flag
  // (i.fv / i.termico) OPPURE se almeno UNO degli installatori che dipendono da lui
  // (coordinatore_id === id del coordinatore) ha quel flag a true.
  // CASO REALE DUREGON ALESSANDRO (verificato il 30/07): coordinatore con fv=false
  // e termico=false, i cui quattro installatori (GHIOTTO, DABRAIO, MARAVIGLIA,
  // SOLAR ENERGY GROUP) sono TUTTI solo fotovoltaico -> DUREGON deve comparire sulle
  // pratiche FOTOVOLTAICHE ma NON su quelle TERMICHE, dove prima compariva a torto.
  // La capacita' dei coordinatori e' calcolata UNA SOLA VOLTA qui sotto (mappa
  // id_coordinatore -> {fv, termico}), MAI dentro il ciclo delle opzioni: altrimenti
  // verrebbe ricostruita per ogni pratica e per ogni menu.
  const capCoord = {};
  installatori.forEach(i=>{
    if(i==null || i.coordinatore_id==null) return;
    const k = String(i.coordinatore_id);
    if(!capCoord[k]) capCoord[k] = {fv:false, termico:false};
    if(i.fv===true)      capCoord[k].fv = true;
    if(i.termico===true) capCoord[k].termico = true;
  });
  // Abilitazione di un COORDINATORE: flag propri OR flag dei suoi installatori.
  function coordAbilitato(i, tipoPratica){
    const c = capCoord[String(i.id)] || {fv:false, termico:false};
    if(tipoPratica==='termico')      return (i.termico===true) || (c.termico===true);
    if(tipoPratica==='fotovoltaico') return (i.fv===true)      || (c.fv===true);
    return true;                                                            // tipo assente/sconosciuto
  }
  function abilitatoPerTipo(i, tipoPratica, selectedId){
    if(i==null) return false;
    if(selectedId!=null && String(selectedId)===String(i.id)) return true;  // gia assegnato: sempre
    if(i.coordinatore===true) return coordAbilitato(i, tipoPratica);        // coordinatore: capacita' dei suoi
    if(tipoPratica==='termico')      return i.termico===true;
    if(tipoPratica==='fotovoltaico') return i.fv===true;
    return true;                                                            // tipo assente/sconosciuto
  }
  // Opzione mostrata quando, dopo il filtro, non resta nessun nominativo: non e'
  // un errore, e' una mancanza di anagrafica (flag fv/termico non impostati).
  const NO_INST_OPT = '<option value="" disabled>Nessun installatore abilitato</option>';
  function assignOptions(selectedId, firstLabel, tipoPratica){
    let out = '<option value="">'+firstLabel+'</option>';
    const lista = assignItems.filter(i=>abilitatoPerTipo(i, tipoPratica, selectedId));
    if(!lista.length) return out + NO_INST_OPT;
    lista.forEach(i=>{
      const lbl = esc(i.nome||('#'+i.id)) + (i.coordinatore===true ? ' (coordinatore)' : ' (installatore)');
      const sel = (selectedId!=null && String(selectedId)===String(i.id)) ? ' selected' : '';
      out += '<option value="'+esc(i.id)+'"'+sel+'>'+lbl+'</option>';
    });
    return out;
  }
  function sopOptions(tipoPratica){
    let out = '<option value="">&mdash; Nessuno &mdash;</option>';
    const lista = assignItems.filter(i=>abilitatoPerTipo(i, tipoPratica, null));
    if(!lista.length) return out + NO_INST_OPT;
    lista.forEach(i=>{ out += '<option value="'+esc(i.id)+'">'+esc(i.nome||('#'+i.id))+'</option>'; });
    return out;
  }

  // -------------------- MENU "APRI PORTALI" (hamburger, header alto a destra) --
  // Elenca i nominativi per aprire il rispettivo portale in nuova scheda:
  //   sezione COORDINATORI (coordinatore===true) + riga divisoria + INSTALLATORI.
  // URL portale = webhook area-installatore?t=<access_token> (per elemento di
  // d.installatori). Chi non ha access_token e' mostrato disabilitato.
  // RIASSUNTO IN CIMA — quello che aspetta, prima ancora di scorrere le schede.
  // Il pallino sul pulsante dice QUALE pratica; questa fascia dice QUANTE cose
  // ci sono e permette di aprirle direttamente. Se non c'e' niente in attesa,
  // o se la chiamata a lotti_in_attesa non ha risposto, non compare nulla.
  function fasciaAttesa(){
    const att = d._attesa || {};
    const chiavi = Object.keys(att);
    if (!chiavi.length) return '';
    const nome = {};
    pratiche.forEach(function(p){ if(p.practice_id && !nome[p.practice_id]) nome[p.practice_id] = p.cliente; });
    const tot = chiavi.reduce(function(s,k){ return s + (att[k].file||0); }, 0);
    const voci = chiavi.map(function(k){
      const u = 'https://n8n.srv1030489.hstgr.cloud/webhook/docs-ai?practice_id='
              + encodeURIComponent(k)
              + (att[k].lotto ? '&lotto=' + encodeURIComponent(att[k].lotto) : '')
              + '&azione=controllo&area=next';
      return '<a class="att-v'+(att[k].doppioni?' dop':'')+'" href="'+esc(u)+'" target="_blank" rel="noopener"'
           + (att[k].doppioni ? ' title="'+att[k].lotti+' caricamenti con gli stessi file: approvane uno solo"' : '')
           + '>' + esc(nome[k] || 'pratica senza nome')
           + '<span class="att-n">'+att[k].file+'</span>'
           + (att[k].doppioni ? '<span class="att-d">&times;'+att[k].lotti+'</span>' : '')
           + '</a>';
    }).join('');
    const quantiDop = chiavi.filter(function(k){ return att[k].doppioni; }).length;
    return '<div class="attesa">'
      + '<div class="att-t">&#9888;&#65039; '
      + (chiavi.length===1 ? 'Una pratica ha' : chiavi.length+' pratiche hanno')
      + ' documenti caricati e non ancora approvati — <b>'+tot+(tot===1?' documento':' documenti')+'</b> in tutto'
      + (quantiDop ? ' <span style="font-weight:400">· in '+(quantiDop===1?'una':quantiDop)+' l’installatore ha caricato due volte gli stessi file: approvane un lotto solo</span>' : '')
      + '</div>'
      + '<div class="att-l">'+voci+'</div></div>';
  }

  function portalMenu(){
    const PORTAL_BASE = 'https://n8n.srv1030489.hstgr.cloud/webhook/area-installatore?t=';
    const byNome = (a,b) => String(a.nome||'').localeCompare(String(b.nome||''), 'it', {sensitivity:'base'});
    const coord = assignItems.filter(i=>i && i.coordinatore===true).slice().sort(byNome);
    const inst  = assignItems.filter(i=>i && i.coordinatore!==true).slice().sort(byNome);
    function itemHtml(i){
      const nome = esc(i.nome||('#'+i.id));
      if(!i.access_token){
        return '<span class="pmenu-item dis" title="Portale non disponibile (token mancante)">'+nome+'</span>';
      }
      const url = PORTAL_BASE + encodeURIComponent(i.access_token);
      return '<a class="pmenu-item" href="'+esc(url)+'" target="_blank" rel="noopener">'+nome+'</a>';
    }
    let out = '';
    out += '<div class="pmenu-sec">Coordinatori</div>';
    out += coord.length ? coord.map(itemHtml).join('') : '<div class="pmenu-empty">Nessun coordinatore</div>';
    out += '<div class="pmenu-div"></div>';
    out += '<div class="pmenu-sec">Installatori</div>';
    out += inst.length ? inst.map(itemHtml).join('') : '<div class="pmenu-empty">Nessun installatore</div>';
    return '<div class="pmenu" id="pmenuWrap">'
      +'<button class="pmenu-btn" type="button" onclick="togglePortalMenu(event)" title="Apri portali" aria-label="Apri portali">&#9776;</button>'
      +'<div class="pmenu-drop" id="pmenuDrop">'+out+'</div>'
    +'</div>';
  }

  // -------------------- FASCETTE -------------------------------------------
  // INCASSATO (alto a sinistra) — il COLORE indica il livello di pagamento
  function ribbon(p){
    const lv = p.pagamento_livello;
    if(lv==='acconto30') return '<span class="paid-rib r-30">INCASSATO</span>';
    if(lv==='acconto50') return '<span class="paid-rib r-50">INCASSATO</span>';
    if(lv==='saldo')     return '<span class="paid-rib r-saldo">INCASSATO</span>';
    return ''; // 'nessuno' / assente -> nessuna fascetta
  }
  // PAGATA (basso a destra, verde) — la fattura dell'installatore e' saldata
  function ribbonPagata(p){
    return p.fattura_pagata===true ? '<span class="pagata-rib">PAGATA</span>' : '';
  }

  // -------------------- CHIP TIPO INTERVENTO -------------------------------
  // Deriva il tipo di intervento della pratica e la classe cromatica dedicata:
  //   Nuovo impianto = verde (.ti-nuovo), Ampliamento = arancio (.ti-ampl),
  //   Rifacimento totale = rosso (.ti-rifac), Aggiunta accumulo = viola (.ti-accumulo).
  //   * TERMICO -> SEMPRE "Nuovo impianto" (nel termico e' sempre nuovo).
  //   * FOTOVOLTAICO -> da imp_esistente/imp_percorso:
  //       imp_esistente==='no' -> Nuovo impianto
  //       imp_esistente==='si' -> rifacimento? Rifacimento totale : accumulo? Aggiunta accumulo : Ampliamento
  //       imp_esistente vuoto/null -> nessun chip (intervento da definire).
  function tipoIntervento(p){
    if(p.tipo_scheda==='termico') return {label:'Nuovo impianto', cls:'ti-nuovo'};
    const ex = p.imp_esistente;
    if(ex==='no') return {label:'Nuovo impianto', cls:'ti-nuovo'};
    if(ex==='si'){
      const perc = p.imp_percorso;
      if(perc==='rifacimento') return {label:'Rifacimento totale', cls:'ti-rifac'};
      if(perc==='accumulo')    return {label:'Aggiunta accumulo', cls:'ti-accumulo'};
      return {label:'Ampliamento', cls:'ti-ampl'};
    }
    return null; // imp_esistente vuoto/null (solo FV) -> nessun chip
  }
  function tipoInterventoChip(p, extraCls){
    const t = tipoIntervento(p);
    const xc = extraCls ? (' '+extraCls) : '';
    return t ? '<span class="chip'+xc+' '+t.cls+'">'+esc(t.label)+'</span>' : '';
  }

  // -------------------- CHIP FLASH IMPIANTO --------------------------------
  // Classificazione ESCLUSIVA su p.tipo_scheda ('termico' | 'fotovoltaico').
  //   * TERMICO: nessun chip FV. Ordine chip termici (classe .c-term, tinta calda):
  //       (a) Caldaia/Pompa = "Pigma 80"(o 50) + " t.<taglia>"; se nessuna pigma ma
  //           altro -> l'altro; (b) Valvole + " ×<num>"; (c) Clima (stringa).
  //   * FOTOVOLTAICO: chip FV come prima (kWp, accumulo, colonnina, ...).
  //   In coda, SEMPRE, il chip TIPO INTERVENTO.
  // extraCls: classe aggiuntiva applicata a OGNI chip (in aggiunta a 'chip' e alla
  // tinta). Usata dalla cronologia per applicare la variante compatta '.chip-cron'
  // riusando ESATTAMENTE la stessa logica/colori delle card normali. Se omessa,
  // comportamento identico a prima (usato da tutte le altre viste).
  function chips(p, extraCls){
    const f=p.flash||{}; const out=[];
    const xc = extraCls ? (' '+extraCls) : '';
    if(p.tipo_scheda==='termico'){
      const t=f.termico||{};
      // (a) Caldaia/Pompa — Pigma 80/50 + taglia; se nessuna pigma, l'altro
      let hasPigma=false;
      if(t.pigma80){ let s='Pigma 80'; if(t.pigma80_taglia) s+=' t.'+esc(t.pigma80_taglia); out.push('<span class="chip'+xc+' c-term">'+s+'</span>'); hasPigma=true; }
      if(t.pigma50){ let s='Pigma 50'; if(t.pigma50_taglia) s+=' t.'+esc(t.pigma50_taglia); out.push('<span class="chip'+xc+' c-term">'+s+'</span>'); hasPigma=true; }
      if(!hasPigma && (t.altro===true || t.altro_desc)) out.push('<span class="chip'+xc+' c-term">'+esc(t.altro_desc||'Altro')+'</span>');
      // (b) Valvole termostatiche + numero
      if(t.valvole){ let s='Valvole'; if(t.valvole_num) s+=' &times;'+esc(t.valvole_num); out.push('<span class="chip'+xc+' c-term">'+s+'</span>'); }
      // (c) Clima (stringa modello)
      if(t.clima) out.push('<span class="chip'+xc+' c-term">'+esc(t.clima)+'</span>');
    } else {
      // FOTOVOLTAICO
      if(f.kwp) out.push('<span class="chip'+xc+' c-fv">FV '+esc(num(f.kwp))+' kWp</span>');
      if(f.accumulo){
        let t='con accumulo';
        if(f.marca_accumulo) t+=' '+esc(f.marca_accumulo);
        if(f.kwh) t+=' '+esc(num(f.kwh))+' kWh';
        out.push('<span class="chip'+xc+' c-ok">'+t+'</span>');
      } else {
        out.push('<span class="chip'+xc+' c-no">senza accumulo</span>');
      }
      if(f.colonnina) out.push('<span class="chip'+xc+' c-amp">Colonnina</span>');
      if(f.ottimizzatori){
        let t='Ottimizzatori';
        if(f.moduli_numero) t+=' &times;'+esc(f.moduli_numero);
        out.push('<span class="chip'+xc+' c-neutral">'+t+'</span>');
      }
      if(f.inverter){
        let t='Inverter '+esc(f.inverter)+(f.trifase===true?' trifase':' monofase');
        out.push('<span class="chip'+xc+' c-neutral">'+t+'</span>');
      }
      if(f.moduli){
        let t='Moduli '+esc(f.moduli);
        if(f.moduli_numero) t+=' &times;'+esc(f.moduli_numero);
        if(f.moduli_potenza_wp) t+=' '+esc(num(f.moduli_potenza_wp))+' Wp';
        out.push('<span class="chip'+xc+' c-neutral">'+t+'</span>');
      }
      if(f.integrato) out.push('<span class="chip'+xc+' c-ok">Integrato</span>');
      // BACKUP — chip riassuntivo (card chiusa) mostrato SOLO se il contratto
      // prevede il sistema backup. Confronto stretto ===true: null/assente -> nessun chip.
      if(f.backup===true) out.push('<span class="chip'+xc+' c-ok">Backup</span>');
    }
    // Chip TIPO INTERVENTO (sempre in coda) — eredita la stessa classe extra
    const ti = tipoInterventoChip(p, extraCls);
    if(ti) out.push(ti);
    return out.join('');
  }

  // -------------------- FLASH ROSSO "DISCREPANZA" + BOX CONFRONTO -----------
  // I valori di confronto Odoo<->contratto sono calcolati a monte (blocco I/O) e
  // agganciati alla pratica come:
  //   p._confronto : array [{campo, contratto, odoo, diverge}] di TUTTE le voci
  //                  effettivamente confrontabili (contratto e Odoo disponibili).
  //   p._disc      : sottoinsieme di p._confronto con diverge===true.
  // Se Odoo non ha risposto / ordine assente -> p._confronto/_disc non esistono
  // (nessun flash, nessun box: fail-safe silenzioso).
  function discBadge(p){
    const dd = Array.isArray(p._disc) ? p._disc : [];
    if(!dd.length) return '';
    return '<span class="disc" title="Discrepanza tra ordine Odoo e contratto">&#9888; DISCREPANZA</span>';
  }
  function confrontoBox(p){
    const rows = Array.isArray(p._confronto) ? p._confronto : [];
    if(!rows.length) return '';
    let body = '<div class="cfr-row cfr-head"><span>Voce</span><span>Contratto</span><span>Odoo</span></div>';
    rows.forEach(r=>{
      // WiFi = voce NON bloccante: resta nel confronto ma NON viene evidenziata in
      // rosso (non entra nel flash discrepanza). Classe neutra '.nb' + nota.
      const nonBlocking = (r.campo==='WiFi');
      const cls = nonBlocking ? 'nb' : (r.diverge ? 'ko' : 'ok');
      const campoLbl = esc(r.campo) + (nonBlocking ? ' <span class="cf-nb">(non bloccante)</span>' : '');
      body += '<div class="cfr-row '+cls+'">'
        +'<span class="cf-campo">'+campoLbl+'</span>'
        +'<span class="cf-contr">'+esc(r.contratto)+'</span>'
        +'<span class="cf-odoo">'+esc(r.odoo)+'</span>'
      +'</div>';
    });
    // Conteggio coerente col flash: esclude la voce WiFi (non bloccante).
    const nDiv = rows.filter(r=>r.diverge && r.campo!=='WiFi').length;
    const sub = nDiv ? (nDiv+' '+(nDiv===1?'voce divergente':'voci divergenti')) : 'Tutto coincide';
    return '<div class="box confronto"><div class="box-t">&#9878; Confronto Odoo &harr; contratto <span class="cfr-sub">('+esc(sub)+')</span></div>'+body+'</div>';
  }

  // -------------------- FASCIA DATE (Sopralluogo / Installazione) + badge ----
  function trBlock(p, showAccBadge){
    const di = datesArr(p);
    let instHtml;
    if(di.length){
      instHtml = '<span class="tr-vals">'+di.map(v=>'<span class="tr-val">'+esc(dataDM(v))+'</span>').join('')+'</span>';
    } else {
      instHtml = '<span class="tr-val">&mdash;</span>';
    }
    const badge = showAccBadge ? '<span class="badge b-acc">Accettata</span>' : '';
    // Ordine (dx -> sx): [badge Accettata] all'angolo, poi [Installazione], poi [Sopralluogo].
    // Le chip stanno in un sotto-contenitore che resta a SINISTRA del badge; il badge
    // e' l'ultimo elemento (nowrap) e resta pinnato nell'angolo in alto a destra.
    return '<span class="tr">'
      +'<span class="tr-chips">'
        +'<span class="tr-col c-sop"><span class="tr-lbl">Sopralluogo</span><span class="tr-val">'+esc(dataDM(p.data_sopralluogo))+'</span></span>'
        +'<span class="tr-col c-inst"><span class="tr-lbl">Installazione</span>'+instHtml+'</span>'
      +'</span>'
      +badge
    +'</span>';
  }

  // -------------------- SEZIONE IMPIANTO (quadranti, da flash) ---------------
  // Classificazione ESCLUSIVA su p.tipo_scheda: una card mostra SOLO la sezione
  // del suo tipo.
  //   * TERMICO -> sezione "Impianto termico" a quadranti (stile arancio):
  //       Caldaia/Pompa (Pigma + taglia), Valvole termostatiche (Sì/No + ×num),
  //       Clima (modello o No), Kit WiFi (Sì/No) + tile full-width "Altro".
  //   * FOTOVOLTAICO -> sezione impianto FV a quadranti (come prima).
  function impianto(p){
    const f=p.flash||{};
    const yn = b => b ? '<span class="yes">Sì</span>' : '<span class="no">No</span>';
    // ----- TERMICO (esclusivo) -----
    if(p.tipo_scheda==='termico'){
      const t=f.termico||{};
      let caldaia='—';
      if(t.pigma80){ caldaia='Pigma 80'; if(t.pigma80_taglia) caldaia+=' <span class="muted">&middot; t.'+esc(t.pigma80_taglia)+'</span>'; }
      else if(t.pigma50){ caldaia='Pigma 50'; if(t.pigma50_taglia) caldaia+=' <span class="muted">&middot; t.'+esc(t.pigma50_taglia)+'</span>'; }
      let valv;
      if(t.valvole){ valv='<span class="yes">Sì</span>'; if(t.valvole_num) valv+=' <span class="muted">&middot; &times;'+esc(t.valvole_num)+'</span>'; }
      else valv='<span class="no">No</span>';
      const clima = t.clima ? esc(t.clima) : '<span class="no">No</span>';
      let out='<div class="imp-grid imp-term">'
        +'<div class="itile term"><span class="il"><span class="ico r">&#128293;</span>Caldaia/Pompa</span><span class="iv">'+caldaia+'</span></div>'
        +'<div class="itile term"><span class="il"><span class="ico r">&#127777;</span>Valvole termostatiche</span><span class="iv">'+valv+'</span></div>'
        +'<div class="itile term"><span class="il"><span class="ico r">&#10052;</span>Clima</span><span class="iv light">'+clima+'</span></div>'
        +'<div class="itile term"><span class="il"><span class="ico r">&#128246;</span>Kit WiFi</span><span class="iv">'+yn(!!t.kit_wifi)+'</span></div>';
      if(t.altro===true || t.altro_desc){
        out+='<div class="itile term full"><span class="il"><span class="ico r">&#9881;</span>Altro</span><span class="iv light">'+esc(t.altro_desc||'Altro')+'</span></div>';
      }
      out+='</div>';
      return out;
    }
    // ----- FOTOVOLTAICO (esclusivo) -----
    let out = '';
    {
      const inv = f.inverter ? (esc(f.inverter)+' <span class="muted">&middot; '+(f.trifase===true?'Trifase':'Monofase')+'</span>') : '—';
      // Riga Moduli — descrizione ESTESA: <brand modello> + potenza (Wp) + dimensioni.
      // Mostra SEMPRE i dati estesi quando esistono; per le sigle Q.410/Q.470 senza
      // modulo a catalogo i campi estesi sono null -> resta la sola sigla (f.moduli).
      let mod;
      if(f.moduli){
        mod = esc(f.moduli);
        if(f.moduli_numero)     mod += ' <span class="muted">&middot; &times;'+esc(f.moduli_numero)+' moduli</span>';
        if(f.moduli_potenza_wp) mod += ' <span class="muted">&middot; '+esc(num(f.moduli_potenza_wp))+' Wp</span>';
        if(f.moduli_dimensioni) mod += ' <span class="muted">&middot; '+esc(f.moduli_dimensioni)+'</span>';
      } else {
        mod = '—';
      }
      let acc;
      if(f.accumulo){
        acc = esc(f.marca_accumulo||'Sì');
        if(f.kwh) acc += ' <span class="muted">&middot; '+esc(num(f.kwh))+' kWh</span>';
      } else { acc = '<span class="no">No</span>'; }
      out += '<div class="imp-grid">'
        +'<div class="itile"><span class="il"><span class="ico o">&#9889;</span>Potenza</span><span class="iv">'+(f.kwp?esc(num(f.kwp))+' kWp':'—')+'</span></div>'
        +'<div class="itile"><span class="il"><span class="ico">&#128268;</span>Inverter</span><span class="iv">'+inv+'</span></div>'
        +'<div class="itile full"><span class="il"><span class="ico">&#9638;</span>Moduli</span><span class="iv light">'+mod+'</span></div>'
        +'<div class="itile"><span class="il"><span class="ico g">&#128267;</span>Accumulo</span><span class="iv">'+acc+'</span></div>'
        +'<div class="itile"><span class="il"><span class="ico">&#9881;</span>Ottimizzatori</span><span class="iv">'+yn(!!f.ottimizzatori)+'</span></div>'
        +'<div class="itile"><span class="il"><span class="ico">&#127968;</span>Impianto integrato</span><span class="iv">'+yn(!!f.integrato)+'</span></div>'
        // TRIFASE — voce ESPLICITA (Sì/No) accanto a "Impianto integrato": stessa
        // funzione yn() e stesso stile delle tile vicine. Resta comunque anche
        // l'indicazione "Trifase/Monofase" appesa alla tile Inverter (sopra) e al
        // chip inverter in chips().
        +'<div class="itile"><span class="il"><span class="ico o">&#9889;</span>Trifase</span><span class="iv">'+yn(f.trifase===true)+'</span></div>'
        // BACKUP — voce ESPLICITA (Sì/No) subito dopo "Trifase": indica se il
        // contratto prevede il sistema BACKUP. Valore dalla chiave flash f.backup
        // esposta dalla RPC; confronto STRETTO ===true cosi' null/assente = No
        // (nessun falso positivo). Icona lampadina (&#128161;) non usata altrove
        // nel quadrante: la batteria (&#128267;) e' gia' dell'Accumulo.
        +'<div class="itile"><span class="il"><span class="ico g">&#128161;</span>Backup</span><span class="iv">'+yn(f.backup===true)+'</span></div>'
        +'<div class="itile"><span class="il"><span class="ico p">&#128664;</span>Colonnina</span><span class="iv">'+yn(!!f.colonnina)+'</span></div>'
        +'</div>';
    }
    if(!out) out = '<div class="imp-empty">Nessun dato impianto disponibile.</div>';
    return out;
  }

  // -------------------- BOX LAYOUT / SCHEMA UNIFILARE ------------------------
  // Distingue file PRESENTE vs ASSENTE (come portale coordinatore/installatore):
  //   * p.schema_unifilare_url valorizzato -> pulsante "Scarica PDF" attivo (download diretto)
  //   * assente -> stato "Non disponibile" con grafica in tenue (thumb spenta)
  const LAY_SVG = '<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><g stroke="#5A7184" stroke-width="2.4"><line x1="52" y1="60" x2="82" y2="60"/><line x1="118" y1="60" x2="148" y2="60"/><line x1="100" y1="74" x2="100" y2="96"/></g><g fill="#fff" stroke="#5A7184" stroke-width="2.4"><rect x="20" y="46" width="32" height="28" rx="3"/><rect x="84" y="46" width="32" height="28" rx="3"/><rect x="148" y="46" width="32" height="28" rx="3"/><rect x="84" y="96" width="32" height="16" rx="3"/></g></svg>';
  function layoutBox(p){
    const url = p.schema_unifilare_url;
    if(url){
      return '<div class="box layout"><div class="box-t">&#128204; Layout e schema unifilare</div>'
        +'<div class="lay-one"><div class="thumb">'+LAY_SVG+'</div>'
        +'<div class="meta"><div class="t">Layout e schema unifilare</div><div class="s">Documento fornito dallo studio &middot; sola lettura</div></div>'
        +'<a class="pdf"'+docOpenAttr(url, docName(url,'layout-schema-unifilare.pdf'))+'>&#128196; Scarica PDF</a></div></div>';
    }
    return '<div class="box layout"><div class="box-t">&#128204; Layout e schema unifilare</div>'
      +'<div class="lay-one lay-none"><div class="thumb thumb-none">'+LAY_SVG+'</div>'
      +'<div class="meta"><div class="t">Layout e schema unifilare</div><div class="s">Documento non ancora caricato dallo studio</div></div>'
      +'<span class="pdf-none">&#9711; Non disponibile</span></div></div>';
  }
  // Box SCHEMA per il TERMICO — stessa veste del box FV, titolo "Schema impianto",
  // condizionale su schema_unifilare_url (Scarica PDF vs Non disponibile).
  function schemaTermicoBox(p){
    const url = p.schema_unifilare_url;
    if(url){
      return '<div class="box layout"><div class="box-t">&#128204; Schema impianto</div>'
        +'<div class="lay-one"><div class="thumb">'+LAY_SVG+'</div>'
        +'<div class="meta"><div class="t">Schema impianto</div><div class="s">Documento fornito dallo studio &middot; sola lettura</div></div>'
        +'<a class="pdf"'+docOpenAttr(url, docName(url,'schema-impianto.pdf'))+'>&#128196; Scarica PDF</a></div></div>';
    }
    return '<div class="box layout"><div class="box-t">&#128204; Schema impianto</div>'
      +'<div class="lay-one lay-none"><div class="thumb thumb-none">'+LAY_SVG+'</div>'
      +'<div class="meta"><div class="t">Schema impianto</div><div class="s">Documento non ancora caricato dallo studio</div></div>'
      +'<span class="pdf-none">&#9711; Non disponibile</span></div></div>';
  }
  // Dispatch box schema in ALTO (prima dei quadranti impianto): termico -> "Schema
  // impianto"; fotovoltaico -> box layout/schema unifilare esistente.
  function schemaBox(p){
    return (p.tipo_scheda==='termico') ? schemaTermicoBox(p) : layoutBox(p);
  }
  // -------------------- DOCUMENTI CARICATI (tessere reali) ------------------
  // La RPC gestione_next_data fornisce p.documenti: array di
  // { id, doc_type, file_name, file_url, mime_type, created_at, caricato_da,
  //   numero, dettaglio, ruolo_persona, sezione }
  // con sezione === 'cliente' | 'sopralluogo' | 'fine_lavori' | 'studio'.
  // ALLINEAMENTO AL PORTALE INSTALLATORE (31/07, rifinitura con Sante): stessa
  // ripartizione in TRE SEZIONI CON TITOLO E CONTEGGIO, stesse etichette, stesse
  // icone (riquadrino con l'ESTENSIONE, niente emoji), stessi colori per sezione.
  //   'cliente'     -> "Documenti cliente"              (identita, tessera sanitaria,
  //                    visura, bollette, contratto firmato, comproprietario, moduli)
  //   'sopralluogo' -> "Documenti sopralluogo"          (report, foto stato esistente)
  //   'fine_lavori' -> "Documenti impianto installato"  (DiCo, foto realizzato,
  //                    autotest inverter, matricole inverter/batteria)
  // La sezione 'studio' (layout / schema unifilare) NON compare qui: ha gia' il suo
  // box dedicato (vedi layoutBox()/schemaTermicoBox()). Una sezione sconosciuta o
  // mancante finisce in "Documenti cliente": nessun documento sparisce.
  const DOC_LABELS = {
    // --- sezione cliente ---
    carta_identita: 'Carta d’identita',
    tessera_sanitaria: 'Tessera sanitaria',
    visura_catastale: 'Visura catastale',
    bolletta_luce: 'Bolletta luce',
    bolletta_gas: 'Bolletta gas',
    contratto_firmato: 'Contratto firmato',
    doc_comproprietario: 'Documento identita',
    cf_comproprietario: 'Codice fiscale',
    modulo_sen_catastali: 'Modulo SEN',
    modulo_firma: 'Modulo firma',
    // --- sezione sopralluogo ---
    report_sopralluogo: 'Report sopralluogo',
    foto_impianto_esistente: 'Foto sopralluogo',
    // --- sezione fine lavori / impianto installato ---
    dico_nuovo: 'DiCo impianto',
    foto_impianto_realizzato: 'Foto impianto realizzato',
    test_inverter: 'Autotest inverter',
    matricola_inverter: 'Matricola inverter',
    matricola_batteria: 'Matricola batteria'
  };

  // Iniziale maiuscola + resto minuscolo, parola per parola (cosi' "PROPRIETARIO"
  // -> "Proprietario", "DE LUCA" -> "De Luca", "D'ANGELO" -> "D'Angelo").
  const capitalizza = s => String(s==null?'':s).toLowerCase()
    .replace(/(^|[\s'’\-])([a-zà-öø-ÿ])/g, (m,sep,ch)=>sep+ch.toUpperCase());

  // RIGA SECONDARIA — solo per i DOCUMENTI DEL CLIENTE, riporta il RUOLO
  // (Proprietario / Cointestatario), non il cognome. Indicazione di Sante: il nome
  // sul file non serve, serve distinguere di chi sono i documenti di identita
  // quando l'immobile e' intestato a due persone. Il dato arriva da
  // doc.ruolo_persona, valorizzato dalla RPC solo sui documenti cliente (mai su
  // foto, DiCo, matricole, schemi dello studio).
  function docSub(doc){
    const r = (doc.ruolo_persona==null) ? '' : String(doc.ruolo_persona).trim();
    if(!r) return '';
    const txt = esc(capitalizza(r));
    return '<span class="dsub" title="'+txt+'">'+txt+'</span>';
  }

  // SET ICONE "D" scelto da Sante: niente simbolo grafico/emoji, un riquadrino con
  // l'ESTENSIONE del file (PDF rosso tenue, immagini azzurro tenue, resto grigio).
  function docExt(doc){
    const nome = String(doc.file_name || doc.file_url || '');
    const m = nome.match(/\.([a-zA-Z0-9]{2,5})(?:\?|$)/);
    let e = m ? m[1].toUpperCase() : '';
    if(!e && /pdf/i.test(doc.mime_type||'')) e = 'PDF';
    if(!e && /^image\//i.test(doc.mime_type||'')) e = 'IMG';
    if(e === 'JPEG') e = 'JPG';
    const cls = (e==='PDF') ? 'ext pdf' : (/^(JPG|PNG|HEIC|WEBP|GIF|IMG)$/.test(e) ? 'ext img' : 'ext oth');
    return '<span class="'+cls+'">'+esc(e || 'FILE')+'</span>';
  }

  function docTile(doc){
    // Etichetta principale: voce di DOC_LABELS + qualificatore (fronte/retro o
    // numero progressivo), cosi' le tessere di identita restano distinguibili fra
    // loro e la riga sotto dice solo di chi sono.
    const base = DOC_LABELS[doc.doc_type] || doc.file_name || 'Documento';
    let det = (doc.dettaglio==null) ? '' : String(doc.dettaglio).trim();
    if(!det && doc.numero!=null) det = String(doc.numero).trim();
    const lbl = esc(det ? (base+' '+det) : base);
    const sub = docSub(doc);   // '' su tutto cio' che non e' documento del cliente
    const dl = doc.file_url
      ? '<a class="dget"'+docOpenAttr(doc.file_url, doc.file_name || docName(doc.file_url, base))+'>Scarica</a>'
      : '';
    return '<div class="doctile">'+docExt(doc)+'<span class="dl">'+lbl+'</span>'+sub+dl+'</div>';
  }

  // Ordine STABILE dentro ogni sezione: prima per doc_type, poi per nome file.
  // Confronto con localeCompare(numeric) cosi' "foto 2" viene prima di "foto 10".
  function ordinaDocs(arr){
    return arr.slice().sort((a,b)=>{
      const ta = String((a&&a.doc_type)||''), tb = String((b&&b.doc_type)||'');
      const ct = ta.localeCompare(tb, 'it', {numeric:true, sensitivity:'base'});
      if(ct !== 0) return ct;
      const fa = String((a&&a.file_name)||''), fb = String((b&&b.file_name)||'');
      return fa.localeCompare(fb, 'it', {numeric:true, sensitivity:'base'});
    });
  }

  // Sezione con titolo e conteggio; se VUOTA non disegna nulla (niente titoli a
  // vuoto). COLORE PER SEZIONE: 'cls' e' la classe di tinta applicata al
  // CONTENITORE e da li, per discendenza CSS, colora titolo (.docs-gt), sfondo /
  // bordo / testo delle tessere (.doctile, .dl) e la riga secondaria (.dsub).
  //   'g-cli' -> azzurro | 'g-sop' -> ambra | 'g-fin' -> verde
  function docsGroup(titolo, arr, cls){
    if(!arr.length) return '';
    return '<div class="docs-group'+(cls?' '+cls:'')+'">'
      +'<div class="docs-gt">'+esc(titolo)+' ('+arr.length+')</div>'
      +'<div class="docs-grid">'+ordinaDocs(arr).map(docTile).join('')+'</div>'
    +'</div>';
  }

  function docsBox(p){
    const docs = Array.isArray(p.documenti) ? p.documenti : [];
    const cli = [], sop = [], fin = [];
    docs.forEach(x=>{
      if(!x) return;
      const s = (x.sezione==null ? '' : String(x.sezione)).trim().toLowerCase();
      if(s === 'studio')           return;   // gia mostrato nel box "Layout e schema unifilare"
      if(s === 'sopralluogo')      sop.push(x);
      else if(s === 'fine_lavori') fin.push(x);
      else                         cli.push(x);   // 'cliente' + sconosciuta/mancante
    });
    const inner = docsGroup('Documenti cliente', cli, 'g-cli')
                + docsGroup('Documenti sopralluogo', sop, 'g-sop')
                + docsGroup('Documenti impianto installato', fin, 'g-fin');
    // Nessun documento in nessuna sezione (o solo documenti dello studio) ->
    // stesso messaggio di quando non c'e' proprio nulla.
    // "Vedi i documenti" — sta su OGNI pratica, non solo su quelle con roba da
    // approvare: apre la panoramica di tutta la pratica (documenti cliente,
    // sopralluogo, impianto montato) sulla pagina di WF-DOCS-AI-v2, dove le foto
    // si vedono in miniatura senza aprire né scaricare niente.
    // area=next e' quello che sblocca l'archivio: il collegamento che riceve
    // l'installatore non lo porta e a lui restano soltanto i suoi file.
    // onclick usa stopP, NON stop: stop() fa preventDefault e impedirebbe al
    // collegamento di aprirsi. Qui serve solo non far chiudere la scheda.
    // pallino ambra se l'installatore ha caricato qualcosa che non e' ancora entrato
    // in archivio: e' il modo di accorgersene senza dipendere dalla mail.
    const att = (d._attesa||{})[p.practice_id];
    const vd = 'https://n8n.srv1030489.hstgr.cloud/webhook/docs-ai?practice_id='
             + encodeURIComponent(p.practice_id||'')
             + (att && att.lotto ? '&lotto=' + encodeURIComponent(att.lotto) : '')
             + '&azione=controllo&area=next';
    const pallino = att
     ? '<span class="pall" title="'+att.file+(att.file===1?' documento':' documenti')+' in attesa di approvazione'
        +(att.doppioni ? ' — attenzione: '+att.lotti+' caricamenti con gli stessi file' : (att.lotti>1?' in '+att.lotti+' caricamenti':''))+'"></span>'
      : '';
    return '<div class="box docs"><div class="box-t"><span>&#128193; Documenti caricati</span>'
      +'<a class="vedidoc'+(att?' attesa':'')+'" href="'+esc(vd)+'" target="_blank" rel="noopener" onclick="stopP(event)">'
      + pallino + '&#128065; Vedi i documenti</a></div>'
      +(inner || '<div class="docs-none">Nessun documento caricato</div>')
    +'</div>';
  }

    // -------------------- SOLLECITI DOCUMENTI (blocco 098-SOLLECITI) ---------
  // Se all'installatore e' stato chiesto qualcosa che non e' ancora arrivato: le voci
  // aperte, quando parte il prossimo sollecito (datario per spostarlo), Blocca invio /
  // Riprendi, e "chiudi" su una voce per chiuderla a mano. Le azioni passano dal webhook
  // gestione-next-azioni -> gestione_next_action -> sollecito_comando.
  // Il dato arriva gia' pronto dalla RPC gestione_next_data (campo richiesta_documenti).
  function sollBox(p, readonly){
    const r = p.richiesta_documenti;
    if (!r || !r.aperte) return '';
    const pid = jesc(p.practice_id);
    const idAttr = esc(p.practice_id);
    const giorno = s => s ? new Date(s).toLocaleDateString('it-IT', { timeZone:'Europe/Rome' }) : '';
    const quando = r.prossimo_invio ? new Date(r.prossimo_invio).toLocaleString('it-IT', { timeZone:'Europe/Rome', weekday:'long', day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit' }) : '';
    const statoTxt =
        r.stato === 'attesa'   ? (r.prossimo_tipo === 'ferma' ? 'Avviso "pratica ferma" a Next e amministrazione: ' + quando : 'Prossimo sollecito: ' + quando)
      : r.stato === 'sospesa'  ? 'Sospeso: l’installatore ha caricato il ' + giorno(r.sospesa_at) + ', si aspetta il nostro controllo'
      : r.stato === 'bloccata' ? 'Bloccato a mano: nessun sollecito in agenda'
      : r.stato === 'ferma'    ? 'Pratica ferma: tre solleciti senza risposta, il sistema non scrive più all’installatore'
      : r.stato === 'in_invio' ? 'Sollecito in partenza proprio ora'
      : r.stato;
    const colore = (r.stato === 'ferma') ? '#b91c1c' : (r.stato === 'bloccata' ? '#6b7280' : '#9a3412');
    const voci = (r.voci || []).filter(v => v.stato === 'aperta');
    const dataVal = r.prossimo_invio ? new Date(r.prossimo_invio).toLocaleDateString('sv-SE', { timeZone:'Europe/Rome' }) : '';
    return '<div class="box soll" style="border-left:3px solid #d9534f">'
      + '<div class="box-t">&#9200; Documenti richiesti all’installatore</div>'
      + '<div style="font-weight:600;color:' + colore + ';margin:4px 0">' + esc(statoTxt) + '</div>'
      + '<div style="font-size:12px;color:#6b7280;margin-bottom:6px">Chiesti il ' + esc((r.richieste_date || []).join(', '))
      + (r.solleciti_inviati ? ' · solleciti partiti: ' + r.solleciti_inviati : '') + '</div>'
      + '<ul style="margin:0 0 8px;padding-left:18px">' + voci.map(v => '<li style="margin:3px 0">' + esc(v.testo)
          + (!readonly ? ' <button class="act ghost" style="padding:1px 8px;font-size:11px;margin-left:6px" onclick="stop(event);sollChiudi(\'' + pid + '\',\'' + jesc(v.id) + '\',this)" title="Chiudi a mano questa voce">chiudi</button>' : '')
          + '</li>').join('') + '</ul>'
      + (!readonly
          ? '<div class="frm">'
            + '<input type="date" id="solld_' + idAttr + '" value="' + esc(dataVal) + '" onclick="stopP(event)" style="margin-right:6px"> '
            + '<button class="act" onclick="stop(event);sollSposta(\'' + pid + '\')">Sposta sollecito</button> '
            + ((r.stato === 'bloccata' || r.stato === 'ferma')
                ? '<button class="act ghost" onclick="stop(event);sollCmd(\'' + pid + '\',\'sollecito_riprendi\')">Riprendi</button>'
                : '<button class="act ghost" onclick="stop(event);sollCmd(\'' + pid + '\',\'sollecito_blocca\')">Blocca invio</button>')
            + '</div><div id="sollmsg_' + idAttr + '" style="font-size:12px;margin-top:6px"></div>'
          : '')
      + '</div>';
  }
  // -------------------- SEZIONE DATE editabile (Sopralluogo / Installazione) --
  // Stessa veste dell'area installatore; salva via webhook gestione-next-azioni
  // (azioni salva_sopralluogo / salva_installazione della RPC gestione_next_action).
  function dateBox(p){
    const pid = jesc(p.practice_id);
    const idAttr = esc(p.practice_id);
    const sopVal = esc((p.data_sopralluogo||'').toString().slice(0,10));
    return '<div class="box sop"><div class="box-t">&#128205; Sopralluogo</div>'
        +'<div class="sopgrid">'
          +'<label>Data<input type="date" id="sopd_'+idAttr+'" onclick="stopP(event)" value="'+sopVal+'"></label>'
          +'<label>Modalità<select id="sopm_'+idAttr+'" onclick="stopP(event)">'
            +'<option value="">—</option>'
            +'<option value="telematico"'+(p.sopralluogo_modalita==='telematico'?' selected':'')+'>Telematico</option>'
            +'<option value="presenza"'+(p.sopralluogo_modalita==='presenza'?' selected':'')+'>In presenza</option>'
          +'</select></label>'
        +'</div>'
        +'<div class="sop-actions"><button class="act" onclick="stop(event);salvaSop(\''+pid+'\')">Salva</button></div>'
      +'</div>'
      +'<div class="box inst"><div class="box-t">&#128295; Installazione</div>'
        +'<div id="dates_'+idAttr+'" class="dates"></div>'
        +'<div class="frm"><button class="act ghost" onclick="stop(event);addDate(\''+pid+'\')">+ Giorno</button><button class="act" onclick="stop(event);salvaInst(\''+pid+'\')">Salva date</button></div>'
      +'</div>'
      +'<div id="msg_'+idAttr+'" class="msg"></div>';
  }

  // -------------------- BOX NOTE (Contratto RO + Per installatore editabile) -
  // 1) "Note contratto"  -> sola lettura, area scrollabile, valore da
  //    p.note_contratto (RPC: coalesce(fv_altro_desc, note, '')).
  // 2) "Note per l'installatore" -> textarea editabile (p.note_installatore),
  //    con "Salva note" -> webhook gestione-next-azioni (azione salva_note della
  //    RPC gestione_next_action). L'operatore copia dal campo 1 la parte utile,
  //    la incolla nel campo 2, aggiunge eventuali indicazioni e salva.
  // In modalita' readonly (tab "Per installatore" / conclusi) entrambi i campi
  // sono in sola lettura (nessuna textarea / bottone).
  function noteBox(p, readonly){
    const pid = jesc(p.practice_id);
    const idAttr = esc(p.practice_id);
    // TERMICO -> palette calda tenue (arancio) sul box note e sui campi note.
    // FOTOVOLTAICO -> resta il fondo azzurrino esistente.
    const termCls = (p.tipo_scheda==='termico') ? ' term' : '';
    const contr = (p.note_contratto||'').toString();
    const inst  = (p.note_installatore||'').toString();
    const contrHtml = contr.trim()
      ? '<div class="notero">'+esc(contr).replace(/\n/g,'<br>')+'</div>'
      : '<div class="noteempty">Nessuna nota dal contratto.</div>';
    if(readonly){
      const instHtml = inst.trim()
        ? '<div class="notero">'+esc(inst).replace(/\n/g,'<br>')+'</div>'
        : '<div class="noteempty">Nessuna nota per l&rsquo;installatore.</div>';
      return '<div class="box notebox'+termCls+'"><div class="box-t">&#128221; Note</div>'
        +'<div class="nlbl">Note contratto <span class="nsub">(sola lettura)</span></div>'+contrHtml
        +'<div class="nlbl" style="margin-top:10px">Note per l&rsquo;installatore</div>'+instHtml
      +'</div>';
    }
    return '<div class="box notebox'+termCls+'"><div class="box-t">&#128221; Note</div>'
      +'<div class="nlbl">Note contratto <span class="nsub">(sola lettura)</span></div>'+contrHtml
      +'<div class="nlbl" style="margin-top:10px">Note per l&rsquo;installatore</div>'
      +'<textarea id="noteinst_'+idAttr+'" class="noteinst" onclick="stop(event)" placeholder="Copia qui la parte utile dalle note del contratto, aggiungi eventuali indicazioni e salva.">'+esc(inst)+'</textarea>'
      +'<div class="note-actions"><button class="act" onclick="stop(event);salvaNote(\''+pid+'\')">Salva note</button></div>'
      +'<div id="notemsg_'+idAttr+'" class="msg"></div>'
    +'</div>';
  }

  // -------------------- RIFERIMENTI ODOO (OV / OA installazione) -------------
  // Numeri arricchiti a monte (I/O): p._so_name / p.odoo_sale_order_fv_id (sale.order)
  // e p._po_name / p._po_id (purchase.order installazione). Resi come LINK verso
  // Odoo quando l'id e' disponibile, altrimenti come testo non linkato.
  //   sale.order    -> https://next-srl.odoo.com/odoo/sales/<saleOrderId>
  //   purchase.order -> https://next-srl.odoo.com/odoo/purchase/<poId>
  function odooRef(tag, kind, id, label){
    const txt = tag+'&nbsp;<b>'+esc(label)+'</b>';
    if(id!=null && String(id)!==''){
      const url = 'https://next-srl.odoo.com/odoo/'+kind+'/'+esc(id);
      return '<a class="oref" href="'+url+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+txt+'</a>';
    }
    return '<span class="oref">'+txt+'</span>';
  }
  function odooRefsInner(p){
    let out='';
    if(p._so_name) out += odooRef('OV','sales', p.odoo_sale_order_fv_id, p._so_name);
    if(p._po_name) out += odooRef('OA','purchase', p._po_id, p._po_name);
    return out;
  }
  // BLOCCO UNICO OV/OA — reso IN FONDO ALLA CARD (in basso a destra, appena sopra
  // la fascetta .pagata-rib), con posizione IDENTICA in ogni vista/modalita'
  // (active, assigned, readonly, done, deleted). E' l'UNICA collocazione: non
  // compare piu' ne' dentro i controlli ne' sotto l'indirizzo. Quando la fattura
  // e' PAGATA aggiunge .orefs-lift per lasciare spazio alla fascetta verde.
  function odooRefsBlock(p){
    const inner = odooRefsInner(p);
    if(!inner) return '';
    const lift = (p.fattura_pagata===true) ? ' orefs-lift' : '';
    return '<span class="orefs orefs-card'+lift+'" title="Ordini Odoo (vendita / acquisto installazione)">'+inner+'</span>';
  }
  const uploadBox =
    '<div class="box up"><div class="box-t">&#128228; Carica documenti (Next)</div>'
    +'<div class="drop" onclick="stop(event)"><span class="ic">&#128228;</span><span class="big">Trascina qui o seleziona</span><span class="sm">Carica un documento se Next deve intervenire</span></div></div>';

  // -------------------- CONTROLLI (Assegna / Sopralluoghista / Odoo) ---------
  // mode: 'active'   -> In entrata: dropdown "Assegna a…" attivo (— Seleziona —)
  //       'assigned' -> Assegnate: dropdown pre-selezionato (— Riassegna —)
  function ctrls(p, mode){
    const pid = jesc(p.practice_id);
    const idAttr = esc(p.practice_id);
    const assignedId = (p.assegnato_installatore_id!=null) ? p.assegnato_installatore_id : p.coordinatore_id;
    const first = (mode==='assigned') ? '&mdash; Riassegna &mdash;' : '&mdash; Seleziona &mdash;';
    const preSel = (mode==='assigned') ? assignedId : null;
    // Tipo impianto della pratica: filtra i menu per specializzazione (vedi
    // abilitatoPerTipo). Passato grezzo: se manca/e' sconosciuto -> nessun filtro.
    const tipoPratica = p.tipo_scheda;
    return '<div class="ctrls" onclick="stop(event)">'
      +'<label>Assegna a&hellip;'
        +'<select id="asg_'+idAttr+'" onclick="stop(event)" onchange="assegna(\''+pid+'\',this)">'+assignOptions(preSel, first, tipoPratica)+'</select>'
      +'</label>'
      +'<label>Sopralluoghista (opz.)'
        +'<select id="sop_'+idAttr+'" onclick="stop(event)">'+sopOptions(tipoPratica)+'</select>'
      +'</label>'
      +'<button class="act odoo" onclick="stop(event)">Crea ordine in Odoo</button>'
    +'</div>';
  }

  // -------------------- CARD PRATICA ----------------------------------------
  // opts.mode : 'active' | 'assigned' | 'readonly'
  function card(p, opts){
    opts = opts||{};
    const mode = opts.mode;
    // readonly: nessun controllo di assegnazione / date editabili
    // ('readonly' = tab "Per installatore"; 'done' = lavori conclusi apribili;
    //  'deleted' = sezione Eliminate, sola lettura come i conclusi)
    const readonly = (mode==='readonly' || mode==='done' || mode==='deleted');
    const isDone = (mode==='done' || mode==='deleted');
    const accettata = !!p.accettata_at;
    const rifiutata = !!p.rifiutata_at;
    const showAcc = (mode!=='active') && accettata; // badge Accettata solo sulle assegnate

    const ind = [p.indirizzo,p.civico].filter(Boolean).join(' ');
    const right = [p.cap,p.citta,p.provincia?('('+p.provincia+')'):''].filter(Boolean).join(' ');
    const loc = [ind,right].filter(Boolean).join(' — ');

    const tel = (p.cliente_telefono||'').replace(/\s+/g,'');
    const contatti=[];
    if(tel) contatti.push('<a class="lnk" href="tel:'+esc(tel)+'">&#128222; '+esc(p.cliente_telefono)+'</a>');
    if(p.cliente_email) contatti.push('<a class="lnk" href="mailto:'+esc(p.cliente_email)+'">&#9993; '+esc(p.cliente_email)+'</a>');

    // Riga "Assegnata a:" (colonna Assegnate + lavori conclusi)
    let assignedLine='';
    if(mode==='assigned' || isDone){
      const an = p.assegnato_a || p.coordinatore_nome || '—';
      const lbl = isDone ? 'Installatore' : 'Assegnata a';
      assignedLine = '<span class="ct">&#128100; '+lbl+': <strong>'+esc(an)+'</strong></span>';
    }

    let cls='det';
    if(readonly) cls+=' ro';   // card SENZA controlli -> altezza compatta (no min-height fisso)
    if(rifiutata) cls+=' rej';

    // Testo per il filtro testuale (cliente + indirizzo/citta + installatore assegnato)
    const assegnatoTxt = [p.assegnato_a, p.coordinatore_nome].filter(Boolean).join(' ');
    const searchText = [p.cliente, loc, assegnatoTxt].filter(Boolean).join(' ').toLowerCase();
    // Tipo scheda per le sotto-schede Fotovoltaico / Termico — CLASSIFICAZIONE
    // ESCLUSIVA su p.tipo_scheda ('termico' | 'fotovoltaico'). Ogni card appartiene
    // a UNA sola scheda; default 'fotovoltaico' se il valore manca. La logica di
    // appartenenza e' in typeMatch (uguaglianza esatta su data-tipo).
    const tipo = (p.tipo_scheda==='termico') ? 'termico' : 'fotovoltaico';
    // Flag per i filtri "Senza sopralluogo" / "Senza installazione":
    //   nosop=1  -> data_sopralluogo vuota/non impostata
    //   noinst=1 -> nessuna data in date_installazione
    const hasSop  = !!(p.data_sopralluogo && String(p.data_sopralluogo).trim());
    const hasInst = datesArr(p).length > 0;
    const noSopAttr  = hasSop ? '0' : '1';
    const noInstAttr = hasInst ? '0' : '1';

    return '<details class="'+cls+'" data-cliente="'+esc((p.cliente||'').toLowerCase())+'" data-incasso="'+esc(p.pagamento_livello||'nessuno')+'" data-tipo="'+tipo+'" data-nosop="'+noSopAttr+'" data-noinst="'+noInstAttr+'" data-search="'+esc(searchText)+'">'
      +'<summary>'
        +ribbon(p)
        +ribbonPagata(p)
        +trBlock(p, showAcc)
        +'<span class="main">'
          +'<span class="nm">'+esc(p.cliente||'—')+'</span>'
          +'<span class="dt">'+esc(loc)+'</span>'
          +(contatti.length?('<span class="ct">'+contatti.join('<span class="sep">·</span>')+'</span>'):'')
          +assignedLine
        +'</span>'
        +'<span class="info">'+discBadge(p)+'<span class="chips">'+chips(p)+'</span></span>'
        +(!readonly ? ctrls(p, mode) : '')
        +odooRefsBlock(p)
        +'<span class="arrow">&#9656;</span>'
      +'</summary>'
      +'<div class="body">'
        +confrontoBox(p)
        +schemaBox(p)
        +'<div class="box impianto"><div class="box-t">Impianto</div>'+impianto(p)+'</div>'
        +noteBox(p, readonly)
        +(!readonly ? dateBox(p) : '')
        +docsBox(p)
        +sollBox(p, mode === 'deleted')
        +(!isDone ? uploadBox : '')
        +(rifiutata?'<div class="rejbar">&#9888; Rifiutata &mdash; da riassegnare</div>':'')
        +stateActions(p, mode)
      +'</div>'
    +'</details>';
  }

  // -------------------- AZIONI STATO MANUALE (Sposta in concluse / Ripristina) -
  // Barra in fondo al corpo card. Sulle ATTIVE (in entrata / assegnate) mostra
  // "Sposta in concluse"; sulle CONCLUSE mostra "Ripristina tra le attive".
  // Entrambe POST al webhook gestione-next-azioni (azioni sposta_conclusi /
  // ripristina_attiva) -> la RPC gestione_next_action scrive stato_next_manuale.
  function stateActions(p, mode){
    const pid = jesc(p.practice_id);
    // Pulsante "Elimina scheda" (rosso tenue) — sposta la scheda nelle Eliminate
    // (NON cancella: scrive stato_next_manuale='eliminata' via azione sposta_eliminate).
    const del = '<button class="act danger" onclick="stop(event);eliminaScheda(\''+pid+'\')">&#128465; Elimina scheda</button>';
    if(mode==='active' || mode==='assigned'){
      return '<div class="statebar">'
        +'<button class="act warn" onclick="stop(event);spostaConclusi(\''+pid+'\')">&#9989; Sposta in concluse</button>'
        +del
      +'</div>';
    }
    if(mode==='done'){
      return '<div class="statebar">'
        +'<button class="act ghost" onclick="stop(event);ripristina(\''+pid+'\')">&#8635; Ripristina tra le attive</button>'
        +del
      +'</div>';
    }
    // 'deleted' — card nella sezione Eliminate: solo Ripristina (torna tra le attive)
    if(mode==='deleted'){
      return '<div class="statebar"><button class="act ghost" onclick="stop(event);ripristina(\''+pid+'\')">&#8635; Ripristina tra le attive</button></div>';
    }
    return '';
  }

  // -------------------- SUDDIVISIONE PRATICHE -------------------------------
  // Le liste ATTIVE e i conclusi selezionano per stato_next specifico: le pratiche
  // con stato_next==='eliminata' restano quindi ESCLUSE da inEntrata/assegnate/conclusi
  // (e di conseguenza da kanban attivi, filtri incasso e tab "Per installatore",
  // che derivano da 'assegnate'). Compaiono SOLO nella sezione Eliminate qui sotto.
  const inEntrata = pratiche.filter(p=>p.stato_next==='in_entrata').sort(recentDesc);
  const assegnate = pratiche.filter(p=>p.stato_next==='assegnata').sort(recentDesc);
  const conclusi  = pratiche.filter(p=>p.stato_next==='lavori_conclusi').sort(recentDesc);
  const eliminate = pratiche.filter(p=>p.stato_next==='eliminata').sort(recentDesc);

  const emptyCol = '<div class="col-empty" style="display:block">Nessuna pratica</div>';

  // -------------------- KANBAN A DUE COLONNE INDIPENDENTI --------------------
  // Ogni colonna (.kcol) e' una LISTA in flex-direction:column: intestazione
  // (.kh) + lista card (.klist) + chiusura (.kf). Le due colonne NON sono piu'
  // interlacciate a righe, quindi quando un filtro nasconde una card (display:none)
  // le rimanenti si RICOMPATTANO una sotto l'altra, senza buchi.
  // L'allineamento a coppie richiesto (i-esima card visibile sx <-> i-esima
  // visibile dx) e' ripristinato via JS da equalizeRows() dopo load / filtri /
  // apertura-chiusura details. Colori e intestazioni delle due colonne conservati
  // (classe todo = sinistra / doing = destra sulla .kcol).
  function kanban(hL, arrL, hR, arrR){
    const listL = arrL.length ? arrL.join('') : emptyCol;
    const listR = arrR.length ? arrR.join('') : emptyCol;
    return '<div class="kanban">'
      +'<div class="kcol todo">'
        +'<div class="kh todo">'+hL+'</div>'
        +'<div class="klist">'+listL+'</div>'
        +'<div class="kf todo"></div>'
      +'</div>'
      +'<div class="kcol doing">'
        +'<div class="kh doing">'+hR+'</div>'
        +'<div class="klist">'+listR+'</div>'
        +'<div class="kf doing"></div>'
      +'</div>'
    +'</div>';
  }

  // -------------------- TAB 1: ASSEGNAZIONE ---------------------------------
  const kanbanHtml = kanban(
    'In entrata ('+inEntrata.length+')', inEntrata.map(p=>card(p,{mode:'active'})),
    'Assegnate ('+assegnate.length+')', assegnate.map(p=>card(p,{mode:'assigned'}))
  );

  const doneHtml =
    '<div class="done-wrap"><details class="done-sec">'
      +'<summary>&#9989; Lavori conclusi ('+conclusi.length+')<span class="da">&#9656;</span></summary>'
      +'<div class="done-body">'
        +(conclusi.length ? conclusi.map(p=>card(p,{mode:'done'})).join('') : '<div class="docs-none">Nessun lavoro concluso.</div>')
      +'</div>'
    +'</details></div>';

  // Sezione "Eliminate" — stessa veste della sezione Lavori conclusi (details chiuso).
  // Card APRIBILI in sola lettura (mode 'deleted'), ciascuna con "Ripristina tra le attive".
  const eliminateHtml =
    '<div class="done-wrap"><details class="done-sec eliminate-sec">'
      +'<summary>&#128465; Eliminate ('+eliminate.length+')<span class="da">&#9656;</span></summary>'
      +'<div class="done-body">'
        +(eliminate.length ? eliminate.map(p=>card(p,{mode:'deleted'})).join('') : '<div class="docs-none">Nessuna scheda eliminata.</div>')
      +'</div>'
    +'</details></div>';

  const tab1 =
    '<div id="assegnazione" class="panel active">'
      +'<div class="ifilter">'
        +'<label for="incassoFilterAsg">Incasso</label>'
        +'<select id="incassoFilterAsg" onchange="filterIncasso(\'assegnazione\', this.value)">'
          +'<option value="Tutti" selected>Tutti</option>'
          +'<option value="Acconto 30%">Acconto 30%</option>'
          +'<option value="Acconto 50%">Acconto 50%</option>'
          +'<option value="Saldo">Saldo</option>'
        +'</select>'
        +'<label for="txtFilterAsg">Cerca</label>'
        +'<input type="text" id="txtFilterAsg" placeholder="Cerca nome, indirizzo..." oninput="filterText(\'assegnazione\', this.value)">'
        +'<label class="chk"><input type="checkbox" id="nosopFilterAsg" onchange="filterNoSop(\'assegnazione\', this.checked)"> Senza sopralluogo</label>'
        +'<label class="chk"><input type="checkbox" id="noinstFilterAsg" onchange="filterNoInst(\'assegnazione\', this.checked)"> Senza installazione</label>'
      +'</div>'
      +'<div class="ptabs">'
        +'<button class="ptab active" type="button" onclick="selectPtype(\'assegnazione\',\'fotovoltaico\',this)">Fotovoltaico</button>'
        +'<button class="ptab" type="button" onclick="selectPtype(\'assegnazione\',\'termico\',this)">Termico</button>'
      +'</div>'
      +kanbanHtml
      +doneHtml
      +eliminateHtml
    +'</div>';

  // -------------------- TAB 2: PER INSTALLATORE -----------------------------
  // Raggruppa le pratiche ASSEGNATE per installatore (assegnato_installatore_id
  // / assegnato_a); per quelle andate a un coordinatore usa coordinatore_nome.
  const groups = {}; const order = [];
  assegnate.forEach(p=>{
    let key, name;
    if(p.assegnato_installatore_id!=null){ key='i:'+p.assegnato_installatore_id; name=p.assegnato_a||('#'+p.assegnato_installatore_id); }
    else if(p.coordinatore_id!=null){ key='c:'+p.coordinatore_id; name=p.coordinatore_nome||('#'+p.coordinatore_id); }
    else { key='n:'+(p.assegnato_a||p.coordinatore_nome||'na'); name=p.assegnato_a||p.coordinatore_nome||'Non assegnato'; }
    if(!groups[key]){ groups[key]={name:name, items:[]}; order.push(key); }
    groups[key].items.push(p);
  });

  const instBlocks = order.map(key=>{
    const g = groups[key];
    const n = g.items.length;
    const notAcc = g.items.filter(p=>!p.accettata_at);
    const acc    = g.items.filter(p=> p.accettata_at);
    return '<div class="inst-block" data-installer="'+esc(g.name)+'">'
      +'<div class="inst-h">'+esc(g.name)+'<span class="cnt">'+n+' '+(n===1?'pratica':'pratiche')+'</span></div>'
      +kanban('Assegnate', notAcc.map(p=>card(p,{mode:'readonly'})), 'Accettate', acc.map(p=>card(p,{mode:'readonly'})))
    +'</div>';
  }).join('');

  const instFilterOpts = order.map(key=>{
    const nm = groups[key].name;
    return '<option value="'+esc(nm)+'">'+esc(nm)+'</option>';
  }).join('');

  const tab2 =
    '<div id="perinstallatore" class="panel">'
      +'<div class="ifilter">'
        +'<label for="instFilter">Filtra per installatore</label>'
        +'<select id="instFilter" onchange="filterInstaller(this.value)">'
          +'<option value="Tutti" selected>Tutti</option>'+instFilterOpts
        +'</select>'
        +'<label for="incassoFilterInst">Incasso</label>'
        +'<select id="incassoFilterInst" onchange="filterIncasso(\'perinstallatore\', this.value)">'
          +'<option value="Tutti" selected>Tutti</option>'
          +'<option value="Acconto 30%">Acconto 30%</option>'
          +'<option value="Acconto 50%">Acconto 50%</option>'
          +'<option value="Saldo">Saldo</option>'
        +'</select>'
        +'<label class="chk"><input type="checkbox" id="nosopFilterInst" onchange="filterNoSop(\'perinstallatore\', this.checked)"> Senza sopralluogo</label>'
        +'<label class="chk"><input type="checkbox" id="noinstFilterInst" onchange="filterNoInst(\'perinstallatore\', this.checked)"> Senza installazione</label>'
      +'</div>'
      +'<div class="ptabs">'
        +'<button class="ptab active" type="button" onclick="selectPtype(\'perinstallatore\',\'fotovoltaico\',this)">Fotovoltaico</button>'
        +'<button class="ptab" type="button" onclick="selectPtype(\'perinstallatore\',\'termico\',this)">Termico</button>'
      +'</div>'
      +(instBlocks || '<div class="docs-none">Nessuna pratica assegnata.</div>')
    +'</div>';

  // -------------------- TAB 3: CRONOLOGIA INSTALLAZIONI ---------------------
  // Timeline degli eventi generati dalle pratiche (escluse le eliminate):
  //   * un evento SOPRALLUOGO per ogni pratica con data_sopralluogo;
  //   * un evento INSTALLAZIONE per OGNI data presente in date_installazione
  //     (se una pratica ha 3 date -> 3 eventi installazione distinti, uno per
  //      giorno; la data dell'evento e' quella specifica data).
  // Ordinamento per data CRESCENTE (passato in alto, futuro in basso), raggruppato
  // per GIORNO. Ogni giorno ha un'intestazione 'gg/mm/aa' con id ancorabile
  // (id="cron-YYYY-MM-DD") per lo scroll dal DATARIO (calendario multi-mese).
  // Ogni evento e' una card COMPATTA apribile (cronCard) con SFONDO/BORDO colorato
  // per tipo e passato/futuro: SOPRALLUOGO rosa (grigio con BORDO ROSA se passato),
  // INSTALLAZIONE azzurra (grigio con BORDO AZZURRO se passata). Chiave giorno
  // 'YYYY-MM-DD' (per ordinamento/raggruppamento e per l'ancora di scroll).
  function dayKey(v){
    if(!v) return '';
    let s;
    if(v instanceof Date){
      if(isNaN(v.getTime())) return '';
      s = v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
    } else { s = String(v); }
    s = s.slice(0,10);
    const t = s.split('-');
    if(t.length!==3 || !t[0] || !t[1] || !t[2]) return '';
    return t[0]+'-'+t[1]+'-'+t[2];
  }
  // Costruisce gli eventi (un SOPRALLUOGO + una INSTALLAZIONE per ogni data) per
  // un elenco di pratiche.
  function buildCronEvents(list){
    const evs = [];
    list.forEach(p=>{
      const dks = dayKey(p.data_sopralluogo);
      if(dks) evs.push({p:p, tipoEvt:'sop', dayKey:dks, evtDate:p.data_sopralluogo});
      // Un evento INSTALLAZIONE per OGNI data di date_installazione.
      datesArr(p).forEach(dv=>{
        const dki = dayKey(dv);
        if(dki) evs.push({p:p, tipoEvt:'inst', dayKey:dki, evtDate:dv});
      });
    });
    return evs;
  }
  // Raggruppa gli eventi per GIORNO in ordine CRESCENTE (passato in alto, futuro
  // in basso). Non muta l'array in ingresso.
  function groupCronByDay(evs){
    const sorted = evs.slice().sort((a,b)=>{ if(a.dayKey<b.dayKey) return -1; if(a.dayKey>b.dayKey) return 1; return 0; });
    const groups = []; const idx = {};
    sorted.forEach(ev=>{
      if(!idx[ev.dayKey]){ idx[ev.dayKey]={key:ev.dayKey, items:[]}; groups.push(idx[ev.dayKey]); }
      idx[ev.dayKey].items.push(ev);
    });
    return groups;
  }
  // TIMELINE PRINCIPALE (datario + giorni): SOLO pratiche NON concluse e NON
  // eliminate (stato_next diverso da 'lavori_conclusi' e 'eliminata').
  const cronEvents = buildCronEvents(pratiche.filter(p=>p.stato_next!=='lavori_conclusi' && p.stato_next!=='eliminata'));
  // SEZIONE IN FONDO — eventi delle pratiche CONCLUSE ed ELIMINATE, in due
  // sottogruppi separati, con le STESSE card evento della timeline, ordinati per data.
  const cronConclGroups = groupCronByDay(buildCronEvents(pratiche.filter(p=>p.stato_next==='lavori_conclusi')));
  const cronElimGroups  = groupCronByDay(buildCronEvents(pratiche.filter(p=>p.stato_next==='eliminata')));
  // Ordina la timeline principale per data CRESCENTE (chiave 'YYYY-MM-DD' ->
  // confronto stringa ok): la data piu' INDIETRO nel tempo in alto, il FUTURO in basso.
  cronEvents.sort((a,b)=>{ if(a.dayKey<b.dayKey) return -1; if(a.dayKey>b.dayKey) return 1; return 0; });
  // Raggruppa per giorno conservando l'ordine crescente (sia i giorni sia,
  // per stabilita' del sort, le card dentro ciascun giorno)
  const cronGroups = []; const cronIndex = {};
  cronEvents.forEach(ev=>{
    if(!cronIndex[ev.dayKey]){ cronIndex[ev.dayKey]={key:ev.dayKey, items:[]}; cronGroups.push(cronIndex[ev.dayKey]); }
    cronIndex[ev.dayKey].items.push(ev);
  });

  // ----- Chip flash per la card evento cronologia — mostrano TUTTI gli elementi
  //       delle card normali (stessa logica/colori di chips(p): FV kWp, accumulo
  //       con/senza + marca + kWh, colonnina, ottimizzatori, inverter +
  //       trifase/monofase, moduli, integrato; termico: Pigma+taglia, valvole,
  //       clima, altro; + chip tipo intervento in coda), ma in versione COMPATTA:
  //       si limita a riusare chips(p) applicando la classe '.chip-cron' a ogni
  //       chip. Cosi' la cronologia resta allineata alle altre viste senza
  //       duplicare la logica.
  function cronFlashChips(p){
    return chips(p, 'chip-cron');
  }

  // ----- CARD EVENTO (compatta) — da CHIUSA mostra tutti i dati richiesti,
  //       apribile per il dettaglio completo (impianto / note / documenti). ----
  function cronCard(ev){
    const p = ev.p;
    const isInst = (ev.tipoEvt==='inst');
    const tipo = (p.tipo_scheda==='termico') ? 'termico' : 'fotovoltaico';
    const badgeLbl = isInst ? 'Installazione' : 'Sopralluogo';
    // SFONDO/BORDO card evento — dipende dal TIPO e da passato/futuro:
    //   SOPRALLUOGO oggi/futuro (.evt-sop)      -> sfondo rosa tenue, bordo rosa
    //   SOPRALLUOGO passato (.evt-sop.past)      -> sfondo grigio, BORDO ROSA 1.5px
    //   INSTALLAZIONE oggi/futuro (.evt-inst)    -> sfondo azzurro tenue, bordo azzurro
    //   INSTALLAZIONE passato (.evt-inst.past)   -> sfondo grigio, BORDO AZZURRO 1.5px
    // "passato" = data evento < oggi. Classe .past calcolata server-side (todayKey
    // del nodo) per evitare il "flash"; markCronPast() la riconcilia lato client
    // in base al fuso locale, per TUTTE le card (sopralluoghi e installazioni).
    const isPastInit = !!(ev.dayKey && (ev.dayKey < todayKey));
    const evtCls   = (isInst ? 'evt-inst' : 'evt-sop') + (isPastInit ? ' past' : '');
    const evtType  = isInst ? 'inst' : 'sop';
    const badgeCls = isInst ? 'ce-badge-inst' : 'ce-badge-sop';
    const ind = [p.indirizzo,p.civico].filter(Boolean).join(' ');
    const right = [p.cap,p.citta,p.provincia?('('+p.provincia+')'):''].filter(Boolean).join(' ');
    const loc = [ind,right].filter(Boolean).join(' — ');
    const inst = p.assegnato_a || p.coordinatore_nome || '—';
    // CONTATTI cliente — telefono (link tel:) + email (link mailto:)
    const tel = (p.cliente_telefono||'').replace(/\s+/g,'');
    const contatti=[];
    if(tel) contatti.push('<a class="lnk" href="tel:'+esc(tel)+'">&#128222; '+esc(p.cliente_telefono)+'</a>');
    if(p.cliente_email) contatti.push('<a class="lnk" href="mailto:'+esc(p.cliente_email)+'">&#9993; '+esc(p.cliente_email)+'</a>');
    const assegnatoTxt = [p.assegnato_a, p.coordinatore_nome].filter(Boolean).join(' ');
    const searchText = [p.cliente, loc, assegnatoTxt].filter(Boolean).join(' ').toLowerCase();
    return '<details class="cron-evt '+evtCls+'" data-daykey="'+esc(ev.dayKey||'')+'" data-evtype="'+evtType+'" data-incasso="'+esc(p.pagamento_livello||'nessuno')+'" data-tipo="'+tipo+'" data-search="'+esc(searchText)+'">'
      +'<summary>'
        +ribbon(p)
        +ribbonPagata(p)
        +'<span class="ce-top">'
          +'<span class="ce-badge '+badgeCls+'">'+badgeLbl+' <span class="ce-date">'+esc(dataDM(ev.evtDate))+'</span></span>'
          +'<span class="ce-arrow">&#9656;</span>'
        +'</span>'
        +'<span class="ce-nm">'+esc(p.cliente||'—')+'</span>'
        +'<span class="ce-addr">'+esc(loc||'—')+'</span>'
        +(contatti.length?('<span class="ce-ct">'+contatti.join('<span class="sep">·</span>')+'</span>'):'')
        +'<span class="ce-inst">&#128100; Installatore: <strong>'+esc(inst)+'</strong></span>'
        // Badge discrepanza reso INSIEME ai chip flash, dentro la stessa riga .ce-chips
        // (va a capo con gli altri) e in versione compatta come i .chip-cron.
        +'<span class="ce-chips">'+discBadge(p)+cronFlashChips(p)+'</span>'
        +odooRefsBlock(p)
      +'</summary>'
      +'<div class="ce-body">'
        +confrontoBox(p)
        +'<div class="box impianto"><div class="box-t">Impianto</div>'+impianto(p)+'</div>'
        +noteBox(p, true)
        +docsBox(p)
      +'</div>'
    +'</details>';
  }

  // ----- DATARIO multi-mese (calendario) — mesi affiancati e scorrevoli ------
  // Mappa giorno -> conteggi sop/inst + elenco "Cliente — tipo" (per il tooltip).
  const cronDayMap = {};
  cronEvents.forEach(ev=>{
    const k = ev.dayKey;
    if(!cronDayMap[k]) cronDayMap[k] = {sop:0, inst:0, list:[]};
    if(ev.tipoEvt==='inst') cronDayMap[k].inst++; else cronDayMap[k].sop++;
    cronDayMap[k].list.push((ev.p.cliente||'—')+' — '+(ev.tipoEvt==='inst'?'Installazione':'Sopralluogo'));
  });
  const MONTHS_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  function pad2(n){ return String(n).padStart(2,'0'); }
  // Intervallo mesi FISSO (indipendente dagli eventi): sempre da UN MESE PRIMA
  // di quello corrente fino a DODICI MESI DOPO quello corrente -> 14 mesi totali
  // (mese-1, mese corrente, +12). I giorni/mesi senza eventi restano vuoti ma
  // visibili e scorrevoli; i giorni con eventi restano marcati e cliccabili.
  // Aritmetica su indice-mese (anno*12 + mese) con normalizzazione del cambio d'anno.
  const nowCal = new Date();
  const todayKey = nowCal.getFullYear()+'-'+pad2(nowCal.getMonth()+1)+'-'+pad2(nowCal.getDate());
  let cyStart, cmStart, cyEnd, cmEnd;
  {
    const baseIdx = nowCal.getFullYear()*12 + nowCal.getMonth(); // indice mese corrente
    const sIdx = baseIdx - 1;   // primo mese = mese corrente - 1
    const eIdx = baseIdx + 12;  // ultimo mese = mese corrente + 12
    cyStart = Math.floor(sIdx/12); cmStart = sIdx%12;
    cyEnd = Math.floor(eIdx/12); cmEnd = eIdx%12;
  }
  function renderCalMonth(y, m){
    const offset = (new Date(y, m, 1).getDay()+6)%7;         // Lun=0 ... Dom=6
    const dim = new Date(y, m+1, 0).getDate();
    let cells = '';
    for(let i=0;i<offset;i++) cells += '<div class="cron-cell empty"></div>';
    for(let dnum=1;dnum<=dim;dnum++){
      const key = y+'-'+pad2(m+1)+'-'+pad2(dnum);
      const tdCls = (key===todayKey) ? ' today' : '';   // evidenzia leggermente OGGI
      const info = cronDayMap[key];
      if(info){
        const total = info.sop + info.inst;
        let shown = 0, sq = '';
        for(let i=0;i<info.sop && shown<3;i++){ sq += '<span class="csq sop"></span>'; shown++; }
        for(let i=0;i<info.inst && shown<3;i++){ sq += '<span class="csq inst"></span>'; shown++; }
        if(total-shown>0) sq += '<span class="csq-more">+'+(total-shown)+'</span>';
        const title = esc(info.list.join('\n'));
        // Stringa clienti per la FASCIA hover in cima al datario: "gg/mm/aa — Cliente
        // — Sopralluogo/Installazione · ..." (separati da " · "). Il title resta come fallback.
        const clientsStr = esc(dataDM(key)+' — '+info.list.join(' · '));
        cells += '<div class="cron-cell has'+tdCls+'" title="'+title+'" data-clients="'+clientsStr+'" onmouseover="cronHover(this)" onclick="cronGo(\''+key+'\')"><span class="cd-n">'+dnum+'</span><span class="cd-sq">'+sq+'</span></div>';
      } else {
        cells += '<div class="cron-cell'+tdCls+'"><span class="cd-n">'+dnum+'</span></div>';
      }
    }
    return '<div class="cron-month">'
      +'<div class="cron-mh">'+MONTHS_IT[m]+' '+y+'</div>'
      +'<div class="cron-wd"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>'
      +'<div class="cron-cells">'+cells+'</div>'
    +'</div>';
  }
  const cronMonths = [];
  { let cy=cyStart, cm=cmStart;
    while(cy<cyEnd || (cy===cyEnd && cm<=cmEnd)){
      cronMonths.push(renderCalMonth(cy, cm));
      cm++; if(cm>11){ cm=0; cy++; }
    }
  }
  // FASCIA HOVER (sopra i mesi/quadrati): mostra i clienti del giorno sotto il mouse.
  const cronHoverbar = '<div class="cron-hoverbar" id="cronHoverbar">Passa sul calendario per vedere i clienti</div>';
  const cronCalHtml = cronMonths.length
    ? cronHoverbar+'<div class="cron-cal-wrap">'+cronMonths.join('')+'</div>'
    : '';

  const cronBody = cronGroups.length
    ? cronGroups.map(g=>'<div class="cron-day" id="cron-'+esc(g.key)+'">'
        +'<div class="cron-dh">'+esc(dataDM(g.key))+'</div>'
        +'<div class="cron-grid">'+g.items.map(cronCard).join('')+'</div>'
      +'</div>').join('')
    : '<div class="docs-none">Nessun evento in cronologia.</div>';

  // ----- SEZIONE IN FONDO "Concluse ed eliminate" (dopo la timeline) ---------
  // Stesse card evento (cronCard: stesso stile/colori/flash) della timeline,
  // raggruppate per giorno in due sottogruppi "Concluse" ed "Eliminate". I giorni
  // qui NON hanno id-ancora (il datario in alto punta solo alla timeline attiva).
  // Le card restano .cron-evt dentro #cronologia, quindi i filtri incasso/testo/
  // FV-Termico agiscono anche qui (via applyFilters).
  function cronDoneDayHtml(g){
    return '<div class="cron-day cron-day-done">'
      +'<div class="cron-dh">'+esc(dataDM(g.key))+'</div>'
      +'<div class="cron-grid">'+g.items.map(cronCard).join('')+'</div>'
    +'</div>';
  }
  const cronConclHtml = cronConclGroups.length
    ? '<div class="cron-sub" data-sub="concluse"><div class="cron-sub-h">&#9989; Concluse</div>'
